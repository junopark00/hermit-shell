<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
  <%- header %>
  <title>Create Account · Shell</title>
</head>

<body id="app" v-cloak>
  <main role="main" style="max-width: 1200px; margin: 1em auto">
    <div class="d-flex gap-4">
      <div class="card p-2">
        <header>
          <h1 class="mb-0">
            <img src="./images/logo-shell-45.png" height="48" alt="" style="image-rendering: pixelated">
            {{ $t('welcome.greeting') }}
          </h1>
        </header>
        <p class="my-2 align-self-start">{{ $t('welcome.create_creds') }}</p>
        <div class="alert alert-warning">
          {{ $t('welcome.create_creds_alert') }}
        </div>
        <form @submit.prevent="save">
          <div class="mb-2">
            <label for="usernameInput" class="form-label">{{ $t('_common.username') }}</label>
            <input type="text" class="form-control" id="usernameInput" autocomplete="username"
              v-model="passwordData.newUsername" />
          </div>
          <div class="mb-2">
            <label for="passwordInput" class="form-label">{{ $t('_common.password') }}</label>
            <input type="password" class="form-control" id="passwordInput" autocomplete="new-password"
              v-model="passwordData.newPassword" required />
          </div>
          <div class="mb-2">
            <label for="confirmPasswordInput" class="form-label">{{ $t('welcome.confirm_password') }}</label>
            <input type="password" class="form-control" id="confirmPasswordInput" autocomplete="new-password"
              v-model="passwordData.confirmNewPassword" required />
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-2" v-bind:disabled="loading">
            {{ $t('welcome.create_account') }}
          </button>
          <div class="alert alert-danger" v-if="error"><b>{{ $t('_common.error') }}</b> {{error}}</div>
          <div class="alert alert-success" v-if="success">
            <b>{{ $t('_common.success') }}</b> {{ $t('welcome.welcome_success') }}
          </div>
        </form>
      </div>
      <div>
        <Resource-Card></Resource-Card>
      </div>
    </div>
  </main>
</body>

<script type="module">
  import { createApp } from "vue"
  import ResourceCard from './ResourceCard.vue'
  import { initApp } from './init'

  let app = createApp({
    components: {
      ResourceCard
    },
    data() {
      return {
        error: null,
        success: false,
        loading: false,
        passwordData: {
          newUsername: "shell",
          newPassword: "",
          confirmNewPassword: "",
        },
      };
    },
    methods: {
      save() {
        if (this.passwordData.newPassword !== this.passwordData.confirmNewPassword) {
          this.error = this.$t('password.error_mismatch');
          return;
        };
        this.error = null;
        this.loading = true;
        fetch("./api/password", {
          headers: {
            'Content-Type': 'application/json'
          },
          method: 'POST',
          body: JSON.stringify(this.passwordData),
        }).then((r) => {
          this.loading = false;
          // A rejected change is a 400 whose JSON body names the reason.
          return r.json().catch(() => ({})).then((rj) => {
            if (r.status === 200 && rj.status === true) {
              this.success = true;
              setTimeout(() => {
                document.location.reload();
              }, 5000);
            } else {
              this.error = this.errorText(r.status, rj.error);
            }
          });
        }).catch(() => {
          this.loading = false;
          this.error = this.$t('_common.network_error');
        });
      },
      errorText(status, error) {
        const known = {
          'Invalid Current Credentials': 'password.error_current',
          'Invalid Username': 'password.error_username',
          'Password Mismatch': 'password.error_mismatch',
        };
        if (known[error]) {
          return this.$t(known[error]);
        }
        return this.$t('password.error_http', { code: status });
      },
    },
  });

  initApp(app);
</script>
